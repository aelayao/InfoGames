<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOGAME</title>
    <link rel="stylesheet" href="include/materialize/css/materialize.css">
    <link rel="stylesheet" href="css/styles.css"">
</head>
<body>
    <a href="#" class="img-consola2">
        <img src="imgs/graphic2.png" alt="Consolas retro" class="imagen-lateral-consolas-amarilla">
    </a>

    <header class="barra-superior"></header>
    
    <header class="header-contenedor">
        <div class="barra-amarilla">
            <div class="vidas-container">
                <img src="imgs/corazao.png" alt="corazon" class="icono-corazon">
                <img src="imgs/corazao.png" alt="corazon" class="icono-corazon">
                <img src="imgs/corazao_vacio.png" alt="corazon vacio" class="icono-corazon">
            </div>
            
            <a href="index.html" class="logo-link">
                <img src="imgs/logo.png" alt="info games logo" class="logo-img">
            </a>
        </div>
    </header>

    <div class="row margen">
        <main class="col s12 m12 l12 grey lighten-5" id="cont_lateral">
            
            <h2>Registrarse</h2>
            <form action="">
                <label for="correo">Correo electronico:</label>
                <input type="text" name="correo" id="correo"
                placeholder="Correo electronico" required>
                <br><br>
                <label for="contra">Contraseña:</label>
                <input type="password" name="contra" id="contra"
                placeholder="Contraseña">
                <br>
                <button type="submit" class="boton teal accent-3 btn-inicio">INICIAR SESIÓN</button>
                <a href="registro.html" class="enlace-registro">¿No tienes cuenta? Registrate aquí...</a>
            </form>
        </main>
    </div>

    <footer>
    <div class="footer-contenido">
        <div class="footer-iconos">
            <a href="#" target="_blank" class="red-social" title="red-social 1"></a>
            <a href="#" target="_blank" class="red-social" title="Red Social 2"></a>
            <a href="#" target="_blank" class="red-social" title="Red Social 3"></a>
            <a href="#" target="_blank" class="red-social" title="Red Social 4"></a>
        </div>

        <div class="footer-textos">
            <p class="footer-titulo">Infogames</p>
            <p>Wiki de Videojuegos</p>
            <p>TID 4° A</p>
            <p class="footer-derechos">Derechos reservados&copy;</p>
        </div>
    </div>
</body>
</html>
